<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>Trading</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #101827;
        color: #f3f6fb;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 15% 15%, #193c3a 0, transparent 38%),
          radial-gradient(ellipse at 85% 85%, #263353 0, transparent 40%),
          #101827;
      }

      main {
        width: min(90vw, 560px);
        padding: 48px;
        border: 1px solid #ffffff20;
        border-radius: 20px;
        background: #ffffff0a;
        box-shadow: 0 24px 80px #0005;
      }

      .eyebrow {
        color: #62ddac;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0 12px;
        font-size: clamp(2.4rem, 8vw, 4rem);
        line-height: 1;
      }

      p {
        color: #b6c1d2;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 18px;
        border-radius: 10px;
        background: #62ddac;
        color: #101827;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        background: #8aebc4;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Trading</span>
      <h1>Bienvenido</h1>
      <p>La aplicación está disponible. Las rutas de la API están bajo <code>/api/v1</code>.</p>
      <a href="/api/v1">Ver API</a>
    </main>
  </body>
</html>
